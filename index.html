<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shan Ali</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mediaqueries.css">
</head>
<body>
    <nav id="desktop-nav">
        <div class="logo">Shan Ali</div>
    </nav>
    <section id="dayscounter">
        <h1 class="title-2">Calculate how many days you lived. &#128340;</h1>
        <div class="dayslived">
            <form onsubmit="calculateDaysLived(event)">
                <h3 id="heading">Enter your date of birth:</h3>
                <br>
                <input type="text" id="birthDate" placeholder="YYYY, MM, DD" title="YYYY, MM, DD" aria-label="Enter your date of birth in the format YYYY, MM, DD">
                <br>
                <button class="btn btn-color-2">Enter</button>
            </form>
            <a onclick="reset()">Reset</a> 
        </div>
    </section>
    <footer>
        <p>Copyright &#169; 2024 Shan Ali. All Rights Reserved.</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
